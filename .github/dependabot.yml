# 依存ライブラリの脆弱性・更新を検知して PR を自動作成する（Issue #9）
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # 細かい更新は 1 本の PR にまとめる（脆弱性修正の PR は個別に作られる）
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
